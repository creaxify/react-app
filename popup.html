<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Grabber</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #8b5cf6;
            --text-main: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            width: 300px;
            padding: 1.5rem;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #94a3b8;
            min-height: 1.5rem;
        }

        .dashboard-link {
            display: block;
            margin-top: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .dashboard-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>WhatsApp Grabber</h1>
    <p style="color: #94a3b8; font-size: 0.875rem;">Scan this page for group links</p>

    <button id="grabBtn" class="btn">Grab Links</button>
    <div id="status" class="status"></div>

    <a href="#" id="openDashboard" class="dashboard-link">Open Dashboard</a>

    <script src="popup.js"></script>
</body>

</html>
